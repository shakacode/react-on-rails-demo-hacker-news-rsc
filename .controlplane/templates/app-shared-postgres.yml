kind: gvc
name: {{APP_NAME}}
spec:
  env:
    - name: RAILS_ENV
      value: production
    - name: RAILS_LOG_LEVEL
      value: info
    - name: RAILS_SERVE_STATIC_FILES
      value: "true"
    - name: REACT_RENDERER_URL
      value: http://renderer.{{APP_NAME}}.cpln.local:3800
    - name: RENDERER_HOST
      value: "0.0.0.0"
    - name: RENDERER_PORT
      value: "3800"
    - name: RENDERER_WORKERS_COUNT
      value: "1"
    - name: RENDERER_SERVER_BUNDLE_CACHE_PATH
      value: /rails/tmp/.node-renderer-bundles
    - name: SOLID_QUEUE_IN_PUMA
      value: "true"
    # The staging/review deploy workflows generate this dictionary secret from
    # SHARED_POSTGRES_URL_PREFIX, using separate logical databases per app and
    # per Rails connection.
    - name: RAILS_MASTER_KEY
      value: cpln://secret/{{APP_SECRETS}}.RAILS_MASTER_KEY
    - name: DATABASE_URL
      value: cpln://secret/{{APP_NAME}}-database.DATABASE_URL
    - name: CACHE_DATABASE_URL
      value: cpln://secret/{{APP_NAME}}-database.CACHE_DATABASE_URL
    - name: QUEUE_DATABASE_URL
      value: cpln://secret/{{APP_NAME}}-database.QUEUE_DATABASE_URL
    - name: CABLE_DATABASE_URL
      value: cpln://secret/{{APP_NAME}}-database.CABLE_DATABASE_URL
    #
    # Optional renderer secret:
    # - name: RENDERER_PASSWORD
    #   value: cpln://secret/{{APP_SECRETS}}.RENDERER_PASSWORD
  staticPlacement:
    locationLinks:
      - {{APP_LOCATION_LINK}}
