# Keys beginning with "cpln_" correspond to your settings in Control Plane.
#
# This demo uses the repository root Dockerfile and runs the Rails web process
# separately from the React on Rails Pro Node renderer. Staging and review apps
# use the shared staging Postgres GVC with app-specific logical databases.
# Production data is expected to live in an external Postgres cluster.

allow_org_override_by_env: true
allow_app_override_by_env: true

aliases:
  common: &common
    cpln_org: shakacode-open-source-examples-staging
    default_location: aws-us-east-2

    setup_app_templates:
      - app
      - rails
      - renderer

    # Create the app identity and app secret policy so workloads can reveal
    # cpln://secret references from GVC env.
    skip_secrets_setup: false

    one_off_workload: rails
    app_workloads:
      - rails
      - renderer

    # Use the repo's real production Dockerfile rather than a second copy in
    # .controlplane/.
    dockerfile: ../Dockerfile

    # The generated review/staging/production workflows will run this when
    # present so database migrations happen before image cutover.
    release_script: release_script.sh

    stale_app_image_deployed_days: 5
    image_retention_days: 7

  staging_review: &staging_review
    <<: *common
    # RAILS_MASTER_KEY and optional renderer secrets are shared by the staging
    # and review apps, while database URLs are generated per app.
    secrets_name: react-on-rails-hn-rsc-demo-secrets
    setup_app_templates:
      - app-shared-postgres
      - rails
      - renderer

  production: &production
    <<: *common
    allow_org_override_by_env: false
    allow_app_override_by_env: false
    cpln_org: my-org-production
    upstream: react-on-rails-hn-rsc-demo-staging

apps:
  react-on-rails-hn-rsc-demo-staging:
    <<: *staging_review

  react-on-rails-hn-rsc-demo-review-pr:
    <<: *staging_review
    match_if_app_name_starts_with: true

  react-on-rails-hn-rsc-demo-production:
    <<: *production
