# Keys beginning with "cpln_" correspond to your settings in Control Plane.
#
# Generated baseline for a Rails app that uses PostgreSQL in production.
# Rename the app keys below if you want something other than the repo name.

allow_org_override_by_env: true
allow_app_override_by_env: true

aliases:
  common: &common
    cpln_org: shakacode-open-source-examples-staging
    default_location: aws-us-east-2
    setup_app_templates:
      - app
      - postgres
      - rails
      - node-renderer

    one_off_workload: rails
    app_workloads:
      - rails
      - node-renderer
    additional_workloads:
      - postgres

    # The renderer must be ready before Rails starts routing SSR/RSC requests.
    deploy_order:
      - [node-renderer]
      - [rails]

    maintenance_workload: maintenance
    release_script: release_script.sh

    stale_app_image_deployed_days: 5
    image_retention_days: 7

  production: &production
    <<: *common
    allow_org_override_by_env: false
    allow_app_override_by_env: false
    cpln_org: shakacode-open-source-examples-production
    upstream: react-on-rails-demo-hacker-news-rsc-staging

apps:
  react-on-rails-demo-hacker-news-rsc-staging:
    <<: *common

  react-on-rails-demo-hacker-news-rsc-review:
    <<: *common
    match_if_app_name_starts_with: true
    # To save review-app database cost, create one shared staging database
    # secret and policy, then uncomment this block and use
    # {{SHARED_SECRET_DATABASE}} in templates that need DATABASE_URL.
    # shared_secret_grants:
    #   - name: database
    #     secret_name: react-on-rails-demo-hacker-news-rsc-review-database-secrets
    #     policy_name: react-on-rails-demo-hacker-news-rsc-review-database-secrets-policy
    # Uncomment to automatically initialize review-app databases:
    # hooks:
    #   post_creation: bundle exec rails db:prepare

  react-on-rails-demo-hacker-news-rsc-production:
    <<: *production
